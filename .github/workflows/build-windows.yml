name: Build Windows App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: build-windows-master
  cancel-in-progress: true

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Remove accidental temporary branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod `
            -Method Delete `
            -Uri "https://api.github.com/repos/$env:REPOSITORY/git/refs/heads/feature/json-export-hardening" `
            -Headers $headers | Out-Null

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release configuration
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          & msbuild src/New-Startup-App-Notifier.csproj `
            /nologo `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /verbosity:minimal 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Thio-Background-App-Notifier-Build-Diagnostics
          path: ${{ runner.temp }}/msbuild.log
          if-no-files-found: error
          retention-days: 7

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $releasePath = (Resolve-Path "src/bin/Release").Path
          $manifestPath = Join-Path $releasePath "SHA256SUMS.txt"
          $manifestLines = Get-ChildItem -Path $releasePath -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($releasePath, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relativePath"
            }
          [System.IO.File]::WriteAllLines($manifestPath, $manifestLines, [System.Text.UTF8Encoding]::new($false))

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: Thio-Background-App-Notifier-Release
          path: src/bin/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish verifiable commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state = if ($env:BUILD_RESULT -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Release build and artifact upload succeeded' } else { 'Release build or artifact upload failed' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = $state
            context = 'Build Windows App / Build Release'
            description = $description
            target_url = $env:RUN_URL
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:REPOSITORY/statuses/$env:COMMIT_SHA" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body | Out-Null
